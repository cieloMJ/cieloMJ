<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="230"
     viewBox="0 0 900 230"
     role="img"
     aria-label="Arcade header banner">

  <!--
    EDIT GUIDE
    1) Change the text content directly inside each <text> element.
    2) Change colors / font sizes / stroke widths in the :root variables below.
    3) Background is transparent by design (no background rectangle).
    4) Text and frame use a black + white double-outline so they remain visible
       on both light and dark backgrounds.
  -->

  <style>
    :root {
      /* =========================
         TEXT CONTENT COLORS
         ========================= */
      --color-top-left: #6CE6C2;
      --color-top-right: #F7CE68;
      --color-title: #F7CE68;
      --color-subtitle: #93A8F8;
      --color-footer: #6CE6C2;

      /* =========================
         FONT SETTINGS
         ========================= */
      --font-main: monospace;
      --font-top-size: 15px;
      --font-title-size: 54px;
      --font-subtitle-size: 19px;
      --font-footer-size: 12px;
      --title-weight: 700;
      --body-weight: 400;
      --title-letter-spacing: 3px;
      --subtitle-letter-spacing: 2px;

      /* =========================
         OUTLINE SETTINGS
         ========================= */
      --outline-dark: #000000;
      --outline-light: #FFFFFF;
      --outline-dark-width: 4px;
      --outline-light-width: 1.8px;

      /* =========================
         FRAME / DIVIDER SETTINGS
         ========================= */
      --frame-dark-width: 4;
      --frame-light-width: 1.6;
      --divider-dark-width: 3;
      --divider-light-width: 1.2;

      /* =========================
         ANIMATION SETTINGS
         ========================= */
      --blink-duration: 2.8s;
    }

    .text-dark-outline {
      font-family: var(--font-main);
      stroke: var(--outline-dark);
      stroke-width: var(--outline-dark-width);
      stroke-linejoin: round;
      paint-order: stroke fill;
    }

    .text-light-outline {
      font-family: var(--font-main);
      stroke: var(--outline-light);
      stroke-width: var(--outline-light-width);
      stroke-linejoin: round;
      paint-order: stroke fill;
    }

    .top-left, .top-right {
      font-size: var(--font-top-size);
      font-weight: var(--body-weight);
    }

    .title {
      font-size: var(--font-title-size);
      font-weight: var(--title-weight);
      letter-spacing: var(--title-letter-spacing);
    }

    .subtitle {
      font-size: var(--font-subtitle-size);
      font-weight: var(--body-weight);
      letter-spacing: var(--subtitle-letter-spacing);
    }

    .footer {
      font-size: var(--font-footer-size);
      font-weight: var(--body-weight);
    }
  </style>

  <!-- =========================
       FRAME (double outline)
       ========================= -->
  <rect x="15" y="15" width="870" height="200" rx="6"
        fill="none" stroke="#000000" stroke-width="4"/>
  <rect x="15" y="15" width="870" height="200" rx="6"
        fill="none" stroke="#FFFFFF" stroke-width="1.6"/>

  <!-- top divider -->
  <line x1="36" y1="56" x2="864" y2="56"
        stroke="#000000" stroke-width="3"/>
  <line x1="36" y1="56" x2="864" y2="56"
        stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- =========================
       TOP LEFT
       Edit this text content below
       ========================= -->
  <text x="36" y="42" class="top-left" fill="var(--color-top-left)">&#9679; CODING MODE</text>

  <!-- =========================
       TOP RIGHT
       Edit this text content below
       ========================= -->
  <text x="864" y="42" text-anchor="end" class="top-right" fill="var(--color-top-right)">&#9733; LEVEL 01</text>

  <!-- =========================
       TITLE
       Edit this text content below
       ========================= -->
  <text x="450" y="123" text-anchor="middle" class=" title" fill="var(--color-title)">MINJI'S DEV ARCADE</text>

  <!-- =========================
       SUBTITLE
       Edit this text content below
       ========================= -->
  <text x="450" y="162" text-anchor="middle" class="subtitle" fill="var(--color-subtitle)">
    - WELCOME TO MY GITHUB -
    <animate attributeName="opacity"
             values="1;1;0.35;1"
             dur="2.8s"
             repeatCount="indefinite"/>
  </text>

  <!-- =========================
       FOOTER
       Edit this text content below
       ========================= -->
  <!-- FRONTEND DEV -->
  <text x="280" y="193" text-anchor="middle"
    class="footer"
    fill="#6CE6C2">[FRONTEND DEV]</text>

  <!-- GAME DEV -->
  <text x="450" y="193" text-anchor="middle"
    class="footer"
    fill="#F7CE68">[GAME DEV]</text>

  <!-- AI ENGINEER -->
  <text x="620" y="193" text-anchor="middle"
    class="footer"
    fill="#93A8F8">[AI ENGINEER]</text>

</svg>
